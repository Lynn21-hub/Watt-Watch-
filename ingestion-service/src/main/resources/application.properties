spring.application.name=ingestion-service
server.port=8082

#kafka 
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.template.default-topic=energy-usage





# Parallel simulator config
simulation.endpoint=http://localhost:8082/api/v1/ingestion/ingest
simulation.parallel-threads=5
simulation.requests-per-interval=1000
simulation.interval=5000